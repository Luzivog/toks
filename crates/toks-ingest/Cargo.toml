[package]
name = "toks-ingest"
version.workspace = true
edition.workspace = true
authors = ["Junho Yeo <hello@junho.io>"]
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Toks local session parsing, incremental scanning, and pricing"
publish = false

[lints]
workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
rayon = "1.10"
simd-json = "0.14"
serde = { workspace = true }
serde_json = { workspace = true }
bincode = "1.3"
walkdir = "2"
chrono = { workspace = true }
chrono-tz = { version = "0.10", default-features = false, features = ["std"] }
iana-time-zone = "0.1"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls-vendored"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }
dirs = { workspace = true }
once_cell = "1"
rusqlite = { workspace = true }
zstd = { workspace = true }
tracing = "0.1"
sha2 = { workspace = true }
hmac = { workspace = true }
getrandom = { workspace = true }
libc = "0.2"
fs2 = "0.4"

[dev-dependencies]
serial_test = "3"
tempfile = { workspace = true }
