[package]
name = "tokscope-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Account, usage history, and plan-limit behavior for Tokscope"

[dependencies]
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
anyhow.workspace = true
dirs = "6"
base64 = "0.22"
# Tokscope-owned local parsing, incremental scanning, and pricing engine.
tokscope-ingest = { path = "../tokscope-ingest" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# Same TLS backend as the ingestion engine, so the artifact is shared.
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls-vendored"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
hmac = "0.12"
getrandom = "0.3"

[[bin]]
name = "tokscope-dump"
path = "src/bin/dump.rs"

[dev-dependencies]
tempfile = "3"
