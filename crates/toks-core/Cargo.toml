[package]
name = "toks-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Account, usage history, and plan-limit behavior for Toks"
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
anyhow.workspace = true
dirs = "6"
base64 = "0.22"
# Toks-owned local parsing, incremental scanning, and pricing engine.
toks-ingest = { path = "../toks-ingest" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "signal", "sync", "time"] }
# Same TLS backend as the ingestion engine, so the artifact is shared.
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls-vendored", "stream"] }
axum = { version = "0.8", features = ["ws"] }
hyper-util = { version = "0.1", features = ["server-auto", "service", "tokio"] }
tower = "0.5"
futures-util = "0.3"
tokio-tungstenite = { version = "0.29", features = ["native-tls-vendored"] }
zstd = "0.13"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
hmac = "0.12"
getrandom = "0.3"
uuid = { version = "1", features = ["v4"] }
toml_edit = "0.22"
nix = { version = "0.29", features = ["fs", "signal", "socket", "uio", "user"] }

[[bin]]
name = "toks-dump"
path = "src/bin/dump.rs"

[[bin]]
name = "toks-router"
path = "src/bin/toks-router.rs"

[dev-dependencies]
tempfile = "3"
