[package]
name = "tokscope-ingest"
version.workspace = true
edition.workspace = true
authors = ["Junho Yeo <hello@junho.io>"]
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Tokscope local session parsing, incremental scanning, and pricing"

[lib]
crate-type = ["rlib"]

[dependencies]
rayon = "1.10"
simd-json = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
walkdir = "2"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.10", default-features = false, features = ["std"] }
iana-time-zone = "0.1"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls-vendored"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }
dirs = "5"
once_cell = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
zstd = "0.13"
tracing = "0.1"
sha2 = "0.10"
hmac = "0.12"
getrandom = "0.3"
libc = "0.2"
fs2 = "0.4"

[dev-dependencies]
serial_test = "3"
tempfile = "3"
