[workspace]
resolver = "2"
members = ["crates/tokscope-ingest", "crates/tokscope-core", "crates/tokscope"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Luzivog/tokscope"
homepage = "https://github.com/Luzivog/tokscope"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"

[profile.release]
lto = "thin"
