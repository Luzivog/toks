[workspace]
resolver = "2"
members = ["crates/toks-ingest", "crates/toks-core", "crates/toks"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Luzivog/toks"
homepage = "https://github.com/Luzivog/toks"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = "full"

[profile.release]
lto = "thin"
